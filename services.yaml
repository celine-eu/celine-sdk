services:
  digital-twin:
    package: dt
    openapi: http://api.celine.localhost/dt/openapi.json
  datasets:
    openapi: http://api.celine.localhost/datasets/openapi.json
  rec-registry:
    package: rec_registry
    openapi: http://api.celine.localhost/rec-registry/openapi.json
  nudging:
    package: nudging
    openapi: http://api.celine.localhost/nudging/openapi.json
  flexibility:
    package: flexibility
    openapi: http://api.celine.localhost/flexibility/openapi.json
  onboarding:
    package: onboarding
    openapi: http://api.celine.localhost/onboarding/openapi.json
  provisioning:
    package: provisioning
    # **Not `api.celine.localhost`, and that is the whole point of this entry.**
    #
    # The provisioning service holds realm-wide Keycloak administration —
    # `manage-users` + `manage-realm` — and is safe to hold it only because
    # nothing outside the network can reach it. There is no ingress route to it
    # and there must not be one: celine-policies `docs/decisions/ADR-0007`, and
    # the guard in `celine-dev/config/caddy/Caddyfile`.
    #
    # So the spec is read from the container's own port on the developer's
    # machine, not through the shared front door. `task gen` needs the service
    # running and listening on 8010, which `docker compose up provisioning` in
    # celine-policies does; a fetch with nothing there is reported and skipped
    # like any other, and the previous snapshot is reused.
    openapi: http://localhost:8010/openapi.json
  ai-assistant:
    package: ai_assistant
    # The platform routes this service at /assistant, not /ai-assistant. The
    # wrong path returned an empty 200 rather than a 404 — Caddy has no handler
    # for it and falls through — so the fetch failed on "spec must be an object"
    # and this service silently never had a spec or a generated client.
    openapi: http://api.celine.localhost/assistant/openapi.json
