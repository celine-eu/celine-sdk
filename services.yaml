services:
  digital-twin:
    package: dt
    openapi: http://api.celine.localhost/dt/openapi.json
  datasets:
    openapi: http://api.celine.localhost/datasets/openapi.json
  rec-registry:
    package: rec_registry
    openapi: http://api.celine.localhost/rec-registry/openapi.json
  nudging:
    package: nudging
    openapi: http://api.celine.localhost/nudging/openapi.json
  flexibility:
    package: flexibility
    openapi: http://api.celine.localhost/flexibility/openapi.json
  ai-assistant:
    package: ai_assistant
    # The platform routes this service at /assistant, not /ai-assistant. The
    # wrong path returned an empty 200 rather than a 404 — Caddy has no handler
    # for it and falls through — so the fetch failed on "spec must be an object"
    # and this service silently never had a spec or a generated client.
    openapi: http://api.celine.localhost/assistant/openapi.json
