[project]
name = "celine-sdk"
version = "1.13.0"
description = "CELINE SDK"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiomqtt>=2.5.0",
    "attrs>=25.4.0",
    "cachetools>=7.0.0",
    "celine-regorus>=0.9.1.post20260227075446",
    "cryptography>=46.0.5",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
]

[tool.check-wheel-contents]
ignore = ["W002"]

[dependency-groups]
dev = [
    "datamodel-code-generator[http,ruff]>=0.53.0",
    "debugpy>=1.8.20",
    "dumpster-cli>=1.4.0",
    "openapi-python-client>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-semantic-release>=10.5.3",
    "typer>=0.21.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
celine-sdk = "celine.sdk.cli.main:create_app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["celine.sdk*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true

